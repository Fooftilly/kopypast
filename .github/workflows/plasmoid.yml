name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git qt6-declarative mesa gettext python-polib jq libxml2 zip unzip

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record Qt version
        run: pacman -Q qt6-base qt6-declarative

      - name: Verify license headers and metadata
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if ! grep -q 'SPDX-License-Identifier: GPL-3.0' "$file"; then
              echo "Missing license header: $file"
              exit 1
            fi
          done < <(find package/contents tests integration -type f \( -name '*.qml' -o -name '*.xml' \) -print0)
          jq -e '.KPackageStructure == "Plasma/Applet" and
            (.KPlugin | .Authors and .Name and .Description and .Icon and .Version and .License and .Id)' package/metadata.json
          xmllint --noout package/contents/config/main.xml

      - name: Parse all QML files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            /usr/lib/qt6/bin/qmlformat "$file" >/dev/null
          done < <(find package/contents tests integration -type f -name '*.qml' -print0)

      - name: Validate translation catalogs
        shell: bash
        run: |
          for file in translate/*.po; do
            msgfmt --check-format -o /dev/null "$file"
          done
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/check_translations.py
          bash -n translate/update-pot.sh
          namespace=$(jq -er '.KPlugin.Id' package/metadata.json)
          for file in translate/*.po; do
            lang=$(basename "$file" .po)
            catalog="package/contents/locale/$lang/LC_MESSAGES/plasma_applet_$namespace.mo"
            test -f "$catalog"
            msgunfmt "$catalog" >/dev/null
          done
          if find package/contents/locale -name '*.mo' ! -name "plasma_applet_$namespace.mo" | grep -q .; then
            echo "Found a catalog with an incorrect translation domain"
            exit 1
          fi

      - name: Run Qt Quick regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -input tests

      - name: Package plasmoid
        run: |
          # Package translations compiled from the current source catalogs.
          bash translate/update-pot.sh
          cd package
          zip -r ../io.github.fooftilly.kopypast.plasmoid .
          cd ..
          unzip -t io.github.fooftilly.kopypast.plasmoid

      - uses: actions/upload-artifact@v4
        with:
          name: plasma-applet-kopypast
          path: io.github.fooftilly.kopypast.plasmoid
          if-no-files-found: error
          retention-days: 7

  plasma-runtime:
    name: Plasma runtime smoke tests
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 20
    steps:
      - name: Install Plasma and test dependencies
        run: pacman -Syu --noconfirm --needed git plasma-sdk plasma-desktop plasma-workspace mesa ttf-dejavu xorg-server-xvfb xorg-xauth xdotool jq dbus

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record Plasma versions
        run: pacman -Q plasma-sdk plasma-desktop plasma-workspace libplasma kirigami qt6-base qt6-declarative

      - name: Install and load widget, test clipboard
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
        run: |
          test -f /usr/share/plasma/plasmoids/org.kde.desktopcontainment/metadata.json
          xvfb-run -a dbus-run-session -- bash integration/smoke.sh

  plasma-wayland:
    name: Plasma Wayland runtime smoke tests
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 20
    steps:
      - name: Install Plasma and compositor dependencies
        run: pacman -Syu --noconfirm --needed git plasma-sdk plasma-desktop plasma-workspace mesa ttf-dejavu xorg-server-xvfb xorg-xauth weston xdotool jq dbus

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record versions
        run: pacman -Q plasma-sdk plasma-desktop plasma-workspace libplasma kirigami qt6-base qt6-declarative weston

      - name: Install and load widget, test native Wayland clipboard
        env:
          QT_QPA_PLATFORM: wayland
          QT_QUICK_BACKEND: software
        run: |
          test -f /usr/share/plasma/plasmoids/org.kde.desktopcontainment/metadata.json
          xvfb-run -a dbus-run-session -- bash integration/smoke.sh

  popup-native-clipboard:
    name: Popup copy with native module (${{ matrix.platform }})
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [xcb, wayland]
    steps:
      - name: Install Plasma, build and compositor dependencies
        run: pacman -Syu --noconfirm --needed git base-devel cmake ninja plasma-sdk plasma-desktop plasma-workspace qt6-wayland mesa ttf-dejavu xorg-server-xvfb xorg-xauth weston xdotool jq dbus perl

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and install the native module
        run: |
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/native
          cmake --install build/native --prefix "$RUNNER_TEMP/kopypast"

      - name: Copy from the popup and read from another client
        env:
          QT_QPA_PLATFORM: ${{ matrix.platform }}
          QT_QUICK_BACKEND: software
        run: |
          export QML_IMPORT_PATH="$RUNNER_TEMP/kopypast/lib/qt6/qml"
          export QML2_IMPORT_PATH="$QML_IMPORT_PATH"
          xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- bash integration/popup-clipboard.sh build/native/clipboard_peer

  diag-editor:
    name: Diagnose editor geometry (${{ matrix.scale }})
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scale: ["1", "1.25"]
    steps:
      - name: Install
        run: pacman -Syu --noconfirm --needed git plasma-sdk plasma-desktop plasma-workspace mesa ttf-dejavu xorg-server-xvfb xorg-xauth dbus perl imagemagick
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
          QT_SCALE_FACTOR: ${{ matrix.scale }}
        run: xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- bash diag/editor.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.scale }}
          path: diag-out
